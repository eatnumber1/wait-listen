# CI: `test` runs the whole suite (`bazel test //...`: the unit test, and the
# VM tests, which boot pinned Debian kernels in a pinned QEMU, TCG only, so no
# KVM is needed) on every push and pull request; `release`, on each push to
# main once `test` passes (and on demand), builds the static musl binaries
# and publishes them as the rolling `latest` prerelease, replacing the
# previous one. Events, not a timer: a release exists exactly when main has
# changed and passed.
#
# Developed and checked locally with nektos/act before pushing
# (third_party/act/README.md): `bazel run //third_party/act -- -j test`.
# Under act the release job builds but doesn't publish (no token).
#
# Actions are pinned by commit. Caches: the repository cache (downloads: the
# ~2 GB LLVM tarball, the Debian packages) is keyed by the lock files and
# saved only on a miss; the disk cache by commit, restoring the newest.

name: CI

on:
  push:
    branches: [main]
    # A version tag (vX.Y.Z) publishes a release of its own, kept for good,
    # for others to pin by hash; `latest` keeps following main.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare
        run: .github/ci/prepare.sh
      - name: Restore repository cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/wl-bazel/repos
          key: repos-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', 'third_party/debian/lock.json', '.bazelversion') }}
          restore-keys: repos-
      - name: Restore disk cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/wl-bazel/disk
          key: disk-test-${{ github.sha }}
          restore-keys: disk-test-
      - name: Test
        # The release configuration (.github/ci/release.sh), so the binaries
        # the VM tests run are the ones the release ships.
        run: bazel test -c opt --strip=always //...
      - name: Save repository cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/wl-bazel/repos
          key: repos-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', 'third_party/debian/lock.json', '.bazelversion') }}
      - name: Save disk cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/wl-bazel/disk
          key: disk-test-${{ github.sha }}

  release:
    needs: test
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # One release job at a time, in order: two at once would both delete and
    # recreate `latest`. A newer push supersedes a release still waiting.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Anything new since the last release?
        # A manual dispatch of an unchanged main publishes nothing new. A
        # version tag always publishes (once: tags don't move).
        id: new
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "publish=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(git ls-remote origin refs/tags/latest | cut -f1)
          echo "last release: ${last:-none}; main: $GITHUB_SHA"
          if [ "$last" = "$GITHUB_SHA" ]; then
            echo "publish=false" >>"$GITHUB_OUTPUT"
          else
            echo "publish=true" >>"$GITHUB_OUTPUT"
          fi
      - name: Prepare
        if: steps.new.outputs.publish == 'true'
        run: .github/ci/prepare.sh
      - name: Restore repository cache
        if: steps.new.outputs.publish == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/wl-bazel/repos
          key: repos-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', 'third_party/debian/lock.json', '.bazelversion') }}
          restore-keys: repos-
      - name: Build
        if: steps.new.outputs.publish == 'true'
        run: .github/ci/release.sh dist
      - name: Publish the version release
        if: steps.new.outputs.publish == 'true' && github.ref_type == 'tag' && !env.ACT
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
            --title "wait-listen $GITHUB_REF_NAME" \
            --notes "Static musl builds of ${GITHUB_SHA} (x86-64 and 32-bit Arm). Verify with \`sha256sum -c SHA256SUMS\`."
      - name: Publish the latest prerelease
        if: steps.new.outputs.publish == 'true' && github.ref_type != 'tag' && !env.ACT
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/* --prerelease --target "$GITHUB_SHA" \
            --title "Latest main (${GITHUB_SHA::12})" \
            --notes "Static musl builds of ${GITHUB_SHA} (x86-64 and 32-bit Arm). Verify with \`sha256sum -c SHA256SUMS\`."
